<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloco de Notas</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <div id="tabs" role="tablist"></div>
        <button id="new-tab" title="Nova aba" aria-label="Nova aba">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </button>
        <div class="drag-fill" data-tauri-drag-region></div>
      </header>
      <nav id="menubar" aria-label="Menu"></nav>
      <main id="editor"></main>
      <footer id="statusbar">
        <span id="sb-pos"></span>
        <span id="sb-chars"></span>
        <span id="sb-zoom"></span>
        <button id="sb-eol" title="Quebra de linha"></button>
        <button id="sb-enc" title="Codificação"></button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
