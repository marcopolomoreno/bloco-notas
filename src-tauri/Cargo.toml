[package]
name = "bloquinho"
version = "0.1.0"
description = "Bloco de notas leve, com abas e sessão que sobrevive ao fechar o app"
edition = "2021"

[lib]
name = "bloquinho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"

# Binário de release o menor possível.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
